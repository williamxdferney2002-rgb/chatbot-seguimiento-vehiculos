<style>

:root{--canvas:#0e0e0e;--carbon:#191919;--graphite:#414042;--steel:#58595b;--slate:#6d6e71;--fog:#a7a9ac;--ash:#d1d3d4;--paper:#fff;--smoke:#2c2c2c;

*{box-sizing:border-box}

<script>
var V = <?!= inicial ?>;
var tab = 'inicio', cliSel = '', salida = '', ocupado = false, ajusteClave = '', cierreClave = '', claveP = {}, borrador = {};

function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function P(n){var neg=n<0,s=Math.abs(n).toFixed(4).split('.'),e=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.'),d=(s[1]||'').replace(/0+$/,'');return (neg?'-$ ':'$ ')+e+(d?','+d:'');}
function F(f){var s=String(f).slice(0,10).split('-');return s.length===3?s[2]+'/'+s[1]+'/'+s[0]:f;}
function clave(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'k'+Date.now()+Math.random().toString(16).slice(2);}

function M(n){return '<span class="m">'+h(P(n))+'</span>';}

// ---- T-028: all months loaded in one background call; arrows need no server ----
var MES={datos:null,p:null};
function precargarMeses(){
  if(MES.p)return;
  var p=MES.p=srv('api_meses').then(function(r){if(MES.p!==p)return;MES.datos=r;if(tab==='abono'||tab==='fletes'||tab==='carros')pintar();}).catch(function(){if(MES.p===p)MES.p=null;});
}

function irMes(p,d){

function consolFiltro(c,v){CO[c]=v;consolCargar();}
function kmTxt(n){return n==null?'<small>sin km</small>':h(P(n))+'/km';}
function tablaConsol(b){
  var sin=b.sinIngresos,oi=b.filas.some(function(f){return f.otros>0;}),cab=sin?['Mes','#Km','#Gastos','#Costo/km']:['Mes','#Km','#Ingresos'].concat(oi?['#Otros ingresos']:[]).concat(['#Gastos','#Ganancia','#Ingreso/km','#Costo/km','#Ganancia/km']);
  var fila=function(f,t){
    var mes=t?'<b>Total</b>':h(mesLbl(f.mes)),km=f.km==null?'—':h(numFmt(f.km,0)),g=function(x){return t?'<b>'+x+'</b>':x;};
    var gan=f.ganancia==null?'':'<span'+(f.ganancia<0?' class="neg"':'')+'>'+h(P(f.ganancia))+'</span>';
    return sin?[mes,g(km),g(h(P(f.gastos))),g(kmTxt(f.costoKm))]:[mes,g(km),g(h(P(f.ingresos)))].concat(oi?[g(h(P(f.otros)))]:[]).concat([g(h(P(f.gastos))),g(gan),g(kmTxt(f.ingKm)),g(kmTxt(f.costoKm)),g(kmTxt(f.ganKm))]);
  };
  return tabla(cab,b.filas.map(function(f){return fila(f,false);}).concat([fila(b.total,true)]))+
    (b.total.mesesSinKm?'<div class="est">'+b.total.mesesSinKm+' mes'+(b.total.mesesSinKm>1?'es':'')+' con plata pero sin km: suman en los totales y no entran en los valores por km.</div>':'');

    '<div><label>Hasta</label><input type="date" value="'+h(f.hasta)+'" onchange="regCampo(\'hasta\',this.value)"></div>'+

    '<div><label>Quién registró o pagó</label><input value="'+h(f.quien)+'" maxlength="60" oninput="regCampo(\'quien\',this.value)"></div>'+

  if(!r)return form+'<div class="vacio">Elija los filtros y toque Buscar.</div>';
  // T-029: aligned record columns; readable server status, active movement unlabeled.
  var EST={'Por cobrar':'p-pen','Pago parcial':'p-par','Pagado':'p-pag','Sin precio':'p-sin','Interno':'p-int','Recibido':'p-fle','Anulado':'p-anu','Reemplazado':'p-anu'};
  var li=r.filas.map(function(x){

      '<span class="c4">'+h(x.concepto||'—')+(urlOk(x.url)?' · <a href="'+h(x.url)+'" target="_blank" rel="noopener">Ver comprobante</a>':'')+'</span><span class="c5 sb">'+h(x.con||'')+'</span>'+
      '<span class="c6 n mr">'+h(P(x.valor))+'</span><i class="br"></i><span class="c7">'+(x.estadoTxt?pill(EST[x.estadoTxt]||'',x.estadoTxt):'')+'</span></div>';}).join('');

  var ley='<p class="est">Estado: en gastos y movimientos de Diego solo se marca «Anulado»; fletes y abonos: Por cobrar, Pago parcial, Pagado, Sin precio o Interno; pagos de clientes: Recibido. Quién: quien pagó el gasto, el cliente, o quien registró.</p>';

    (li?tabla2+ley:'<div class="vacio">Sin resultados.</div>')+'</div>';
}

function pngCliente(m){
  return new Promise(function(ok,mal){
    var W=720,S=2,pad=24,fila=26,cv=document.createElement('canvas'),x=cv.getContext('2d');
    var alto=pad*2+100+m.cobros.length*(fila*2+6)+(m.pagos.length?40+m.pagos.length*fila:0)+(m.sinPrecio.length?fila+10:0)+90;
    cv.width=W*S;cv.height=alto*S;x.scale(S,S);x.fillStyle='#fff';x.fillRect(0,0,W,alto);x.textBaseline='top';
    var F1='Inter, Arial, sans-serif',y=pad;
    function t(s,px,py,o){o=o||{};x.font=(o.b?'700 ':'400 ')+(o.fs||14)+'px '+F1;x.fillStyle=o.c||'#333';x.textAlign=o.al||'left';
      if(o.max){while(s.length>3&&x.measureText(s).width>o.max)s=s.slice(0,-2);}x.fillText(s,px,py);}
    function rr(px,py,w,hh,r,c){x.fillStyle=c;x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+hh,r);x.arcTo(px+w,py+hh,px,py+hh,r);x.arcTo(px,py+hh,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();x.fill();}
    t('Estado de cuenta · '+m.cliente,pad,y,{b:1,fs:20,max:W-2*pad});y+=30;
    t('Al '+F(m.fecha),pad,y,{c:'#6c6c6c'});y+=34;
    m.cobros.forEach(function(c){
      rr(pad,y-4,W-2*pad,fila+4,10,'#f8f8f6');t(F(c.fecha)+' · '+c.tipo+(c.placa?' · '+c.placa:''),pad+10,y,{b:1,max:W-2*pad-160});t(P(c.saldo),W-pad-10,y,{b:1,al:'right'});y+=fila+4;
      t((c.producto||'—')+' x '+c.cantidad+' · total '+P(c.total)+' · pagado '+P(c.pagado),pad+10,y,{fs:12,c:'#6c6c6c',max:W-2*pad-20});y+=fila+2;
    });
    if(m.pagos.length){y+=10;t('Pagos recibidos',pad+10,y,{b:1});y+=30;
      m.pagos.forEach(function(p){t(F(p.fecha)+' · '+(p.medio||'—')+(p.recibio?' · recibió '+p.recibio:''),pad+10,y,{fs:13,max:W-2*pad-160});t(P(p.valor),W-pad-10,y,{al:'right',fs:13});y+=fila;});}
    if(m.sinPrecio.length){y+=10;t(m.sinPrecio.length+' cobro'+(m.sinPrecio.length>1?'s':'')+' sin precio (aún no suman al saldo)',pad+10,y,{fs:12,c:'#6c6c6c'});y+=fila;}
    y+=14;rr(pad,y,W-2*pad,56,28,'#d7eb80');t('Saldo total',pad+22,y+17,{b:1,fs:18});t(P(m.saldo),W-pad-22,y+15,{b:1,fs:22,al:'right'});
    cv.toBlob(function(b){b?ok(b):mal(new Error('No se pudo crear la imagen.'));},'image/png');
  });
}
function bor(i,v){borrador[V.precios[i].id]=v;}
function guardarPrecio(i){

function ir(t){tab=t;salida='';if(t==='acpm'){AC.cache={};acpmCargar();}else if(t==='inicio'&&!CO.r)consolCargar();else pintar();}

document.addEventListener('keydown',function(e){var t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click();}});
function hoja(html){var v=document.getElementById('vel');document.getElementById('hoja').innerHTML=html;v.classList.add('on');}

// ---- adjustment ----
function ajuste(){
  if(!ajusteClave)ajusteClave=clave();
  hoja('<h2>Ajuste manual</h2>'+
    '<label>Clase</label><select id="a_clase"><option>Ganado</option><option>Adelantado</option><option>Recibido</option><option>Descuento</option></select>'+
    '<label>Fecha</label><input id="a_fecha" type="date" value="'+hoy()+'">'+
    '<label>Placa (opcional)</label><select id="a_placa"><option value="">Sin placa</option>'+V.placas.map(function(p){return '<option>'+h(p)+'</option>';}).join('')+'</select>'+
    '<label>Detalle</label><input id="a_det" maxlength="200" placeholder="Qué es el ajuste">'+
    '<label>Valor</label><input id="a_val" inputmode="decimal" placeholder="Ej. 150000">'+
    '<div class="err" id="a_err"></div><div class="acc"><button class="btn" onclick="cerrarHoja()">Cancelar</button><button class="btn pri" id="a_ok" onclick="enviarAjuste()">Guardar</button></div>');
}
function enviarAjuste(){
  if(ocupado)return; var b=document.getElementById('a_ok'),er=document.getElementById('a_err');
  var f={clave:ajusteClave,clase:document.getElementById('a_clase').value,fecha:document.getElementById('a_fecha').value,placa:document.getElementById('a_placa').value,detalle:document.getElementById('a_det').value,valor:document.getElementById('a_val').value};
  ocupado=true;b.disabled=true;er.textContent='Guardando…';
  srv('api_ajuste',f).then(function(r){
    ocupado=false;
    if(!r.ok){b.disabled=false;er.textContent=r.error;return;}
    nuevaV(r.vista);ajusteClave='';cerrarHoja();msg(r.duplicado?'Ese ajuste ya estaba registrado.':'Ajuste registrado.');
  }).catch(function(e){ocupado=false;b.disabled=false;er.textContent=e.message;});
}

// ---- close period ----
function cerrar(){
  if(!cierreClave)cierreClave=clave();
  var m=V.hoy;
  hoja('<h2>Cerrar corte</h2><p>Cerrar corte con saldo <b class="m">'+h(P(m.saldo))+'</b>. '+h(m.estado)+'.</p><p class="est">Se congelan los registros del periodo, se guarda el PDF y se envía el correo. Esto no se deshace.</p>'+
    '<div class="err" id="c_err"></div><div class="acc"><button class="btn" onclick="cerrarHoja()">Cancelar</button><button class="btn pri" id="c_ok" onclick="confirmarCierre()">Sí, cerrar corte</button></div>');
}
function confirmarCierre(){
  if(ocupado)return; var b=document.getElementById('c_ok'),er=document.getElementById('c_err');
  ocupado=true;b.disabled=true;er.textContent='Cerrando… (puede tardar unos segundos)';
  srv('api_cerrar',{clave:cierreClave,saldoVisto:V.hoy.saldo}).then(function(r){
    ocupado=false;
    if(!r.ok){b.disabled=false;er.textContent=r.error;if(/cambiaron/.test(r.error))setTimeout(recargar,1200);return;}
    nuevaV(r.vista);cierreClave='';cerrarHoja();
    var e=r.entrega;
    msg(r.duplicado?'Ese corte ya estaba cerrado ('+h(r.id)+').':'Corte '+h(r.id)+' cerrado.'+(e&&e.errores&&e.errores.length?' Pero falló: '+h(e.errores.join('; '))+'. Use «Reintentar PDF/correo».':e?' PDF guardado y correo enviado a '+h(e.enviadoA)+'.':''));
  }).catch(function(e){ocupado=false;b.disabled=false;er.textContent=e.message+' Recargue antes de reintentar.';});
}
function recargar(){srv('api_cuenta').then(function(v){nuevaV(v);cerrarHoja();msg('Datos recargados.');}).catch(function(e){msg(h(e.message));});}
function reintentar(){
  if(ocupado)return;ocupado=true;msg('Reintentando…');
  srv('api_reintentar',V.reintento).then(function(r){ocupado=false;if(!r.ok){msg(h(r.error));return;}nuevaV(r.vista);var e=r.entrega;msg(e.errores.length?'Sigue fallando: '+h(e.errores.join('; ')):'Listo: PDF guardado y correo enviado.');}).catch(function(e){ocupado=false;msg(h(e.message));});
}

      if(o.max){while(s.length>3&&x.measureText(s).width>o.max)s=s.slice(0,-2);}x.fillText(s,px,py);}
    function rr(px,py,w,hh,r,c){x.fillStyle=c;x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+hh,r);x.arcTo(px+w,py+hh,px,py+hh,r);x.arcTo(px,py+hh,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();x.fill();}
    t('Estado de cuenta de Diego',pad,y,{b:1,fs:22});y+=30;

    t('Hasta hoy '+F(hoy()),pad,y,{c:'#6c6c6c'});y+=34;
    rr(pad,y-4,W-2*pad,fila+4,10,'#f0f0eb');t('Saldo anterior',pad+10,y,{b:1});t(P(m.saldoAnterior),W-pad-10,y,{b:1,al:'right'});y+=34;
    m.bloques.forEach(function(b){
      rr(pad,y-4,W-2*pad,fila+4,10,'#f8f8f6');t(F(b.fecha),pad+10,y,{b:1});t(b.placas.join(', ')||'—',W-pad-10,y,{al:'right',c:'#6c6c6c'});y+=34;
      b.items.forEach(function(i){var neg=i.grupo==='recibido'||i.grupo==='descuentos';
        t(i.placa||'—',pad+10,y,{fs:12,c:'#6c6c6c'});t(i.concepto+' ('+ROT[i.grupo]+')',pad+84,y,{max:W-pad-84-130});t((neg?'-':'')+P(i.valor),W-pad-10,y,{al:'right'});y+=fila;});
      t('Total del día',W-pad-130,y,{b:1,al:'right'});t(P(b.total),W-pad-10,y,{b:1,al:'right'});y+=30+10;
